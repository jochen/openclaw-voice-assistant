# Gaston-Wakeword — trainiert 2026-07-05 auf ai-stack (Wakeword-Studio M2, Runde 2)
name: gaston
display: "Gaston"
model: gaston.tflite
# 0.35: Live-Test 2026-07-05 zeigte 1-2-Frame-Near-Misses bei echtem "Gaston";
# FP-Sweep mit 3-Frame-Debounce ergab 0.00 FP/h bis hinunter zu Threshold 0.25.
threshold: 0.35
# "Gaston" ist kurz (~0.5s ≈ 6 Frames) — echte Rufe erreichen oft nur
# 2er-Streaks (Test-Set 2026-07-06: +3 von 20 Takes gegenüber min_hits 3).
# FP-geprüft: 2 Hits mit 1-Frame-Gap = 0.09 FP/h auf 10.7h Validierung.
min_hits: 2
# Peak-Bedingung (2026-07-07): bester Score im Streak muss >= 0.7 sein.
# Echte Rufe peaken 0.92-0.99 (Test-Set + Live-Logs, schwächster echter
# Take: 0.79); FPs aus Gesprächsfetzen bleiben flach (Live-FP 12:39 Uhr:
# 0.41/0.68, Validierungs-FP: < 0.6). eval_peak.py: 0.00 FP/h ab min_peak
# 0.6 auf 10.7h; Recall-Kosten: 1 von 11 triggernden Takes (Peak 0.50).
min_peak: 0.7
# Gestufte Peak-Bedingung für Kurz-Streaks (2026-07-13): 2-Frame-Trigger
# brauchen Peak >= 0.9. Live-Logs 08.-13.07.: alle vier 2-Frame-Trigger waren
# False Positives (Peaks 0.70/0.77/0.83/0.92), der einzige echte 2-Frame-Ruf
# (Test 08.07. 23:19) peakte 0.93. Ab 3 Frames gilt weiter min_peak 0.7.
min_peak_short: 0.9
spellings:
  - "ɡastˈɔ̃ (Phonem-Eingabe, de-Stimmen ohne Nasal → effektiv 'Gastó', 60%)"
  - "Gastong (40%)"
created: 2026-07-05
# Quell-Modell der tflite (onnx2tf -kat x → float32): gaston.onnx braucht die
# externen Gewichte gaston.onnx.data zwingend daneben.
source_model: gaston.onnx
training:
  generator: piper-sample-generator (onnx-Voices, deutsch)
  voices: thorsten-medium/high/emotional, karlsson, pavoque, ramona, kerstin(nur nasal, gedrosselt), eva_k(nur gastong)
  positive_samples: 29995
  adversarial_negatives: 30000
  config: gaston.yaml (layer_size 64, max_negative_weight 500, fp_target 0.5/h)
  validation:
    augmented_test_recall_at_0.5: 0.19
    raw_clip_recall_kerncluster: 0.93-1.00
    false_per_hour_at_0.5: 0.19
