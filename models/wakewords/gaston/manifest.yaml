# Gaston-Wakeword — trainiert 2026-10-02 auf ai-stack (Runde 4: 30k synthetisch
# + 131 echte Rufe + 43 per Ohr belegte Fehltrigger, je x10; Positive vom
# Paket selbst auf 1,8 s geschnitten, Marker-Rufe je Wakewort-Vorkommen).
# Schranke VOR dem Training festgelegt (WAKEWORD_PROCESS.md, "Nachtraining
# Runde 4"), alle vier erfuellt — frische Val-Tage gegen v3: echte Rufe 41/48
# (v3 37; gepaart 8 Gewinne / 4 Verluste), harte Fehltrigger 17/36 (v3 21),
# Studio 14/20 (v3 12), FP/h generisch 0,09 (3-Frame @0,35).
# Vorgaenger v3 (Runde 3, 2026-09-16) liegt in der Git-Historie dieser Dateien.
# ACHTUNG: die Gate-Parameter unten (min_peak_short/min_peak_single) sind an
# den Score-Verteilungen des VORGAENGERS geeicht und beim Deploy bewusst
# unveraendert gelassen (auch bei v4) — ob sie passen, klaert die Betriebsbeobachtung.
name: gaston
display: "Gaston"
model: gaston.tflite
# 0.35: Live-Test 2026-07-05 zeigte 1-2-Frame-Near-Misses bei echtem "Gaston";
# FP-Sweep mit 3-Frame-Debounce ergab 0.00 FP/h bis hinunter zu Threshold 0.25.
threshold: 0.35
# "Gaston" ist kurz (~0.5s ≈ 6 Frames) — echte Rufe erreichen oft nur
# 2er-Streaks (Test-Set 2026-07-06: +3 von 20 Takes gegenüber min_hits 3).
# FP-geprüft: 2 Hits mit 1-Frame-Gap = 0.09 FP/h auf 10.7h Validierung.
min_hits: 2
# Peak-Bedingung (2026-07-07): bester Score im Streak muss >= 0.7 sein.
# Echte Rufe peaken 0.92-0.99 (Test-Set + Live-Logs, schwächster echter
# Take: 0.79); FPs aus Gesprächsfetzen bleiben flach (Live-FP 12:39 Uhr:
# 0.41/0.68, Validierungs-FP: < 0.6). eval_peak.py: 0.00 FP/h ab min_peak
# 0.6 auf 10.7h; Recall-Kosten: 1 von 11 triggernden Takes (Peak 0.50).
min_peak: 0.7
# Gestufte Peak-Bedingung für Kurz-Streaks (2026-07-13): 2-Frame-Trigger
# brauchen Peak >= 0.9. Live-Logs 08.-13.07.: alle vier 2-Frame-Trigger waren
# False Positives (Peaks 0.70/0.77/0.83/0.92), der einzige echte 2-Frame-Ruf
# (Test 08.07. 23:19) peakte 0.93. Ab 3 Frames gilt weiter min_peak 0.7.
min_peak_short: 0.9
# 1-Frame-Trigger (2026-07-26): ein EINZELNER Frame darf triggern, wenn sein
# Peak >= 0.75 liegt. Grund: von 16 Near-Misses waren 6 nachweislich echte Rufe
# (per STT-Triage, tools/wake_triage.py) und 9 Rauschen — und 5 der 6 echten
# kamen als EINZELNE Spitze an, scheiterten also an min_hits, nicht am Peak.
# Die Peaks des Rauschens endeten bei 0.58, die wiedergewinnbaren echten Rufe
# begannen bei 0.82; 0.75 liegt in der leeren Lücke dazwischen, mit Abstand
# nach unten. Wirkung an den Daten: 4 der 6 verlorenen Rufe kommen durch,
# 0 der 9 Rausch-Ereignisse. Die zwei Rufe bei 0.37/0.38 sind durch keine
# Schwelle zu retten (dort liegt Rauschen gleichauf) — Modellproblem.
# Restrisiko: die FP-Analyse 08.-13.07. fand 2-Frame-Fehltrigger mit Peaks bis
# 0.92; solche kommen hier durch. Rate unbekannt, Stichprobe war ein Tag.
# AUS seit 2026-09-25 (vorher 0.75). Mit v3 hat sich der Handel gedreht:
# seit dem Deploy 2026-09-16 brachte der Pfad 0 belegte echte Rufe und 12
# Fehltrigger (wake_triage --seit 10 --auch-trigger), allein am 25.09. 5 von
# 10 Triggern. v3 erreicht echte Rufe mit richtigen Streaks. Vorzeitig vor dem
# Ende der v3-Wette entschieden (Jochen) — die Gegenwette steht in
# WAKEWORD_PROCESS.md, "Wette 1-Frame-Pfad aus". Zurueck: 0.75.
min_peak_single: 0.0
spellings:
  - "ɡastˈɔ̃ (Phonem-Eingabe, de-Stimmen ohne Nasal → effektiv 'Gastó', 60%)"
  - "Gastong (40%)"
created: 2026-07-05
# Quell-Modell der tflite (onnx2tf -kat x → float32): gaston.onnx braucht die
# externen Gewichte gaston.onnx.data zwingend daneben.
source_model: gaston.onnx
training:
  generator: piper-sample-generator (onnx-Voices, deutsch)
  voices: thorsten-medium/high/emotional, karlsson, pavoque, ramona, kerstin(nur nasal, gedrosselt), eva_k(nur gastong)
  positive_samples: 29995
  adversarial_negatives: 30000
  config: gaston.yaml (layer_size 64, max_negative_weight 500, fp_target 0.5/h)
  validation:
    augmented_test_recall_at_0.5: 0.19
    raw_clip_recall_kerncluster: 0.93-1.00
    false_per_hour_at_0.5: 0.19
