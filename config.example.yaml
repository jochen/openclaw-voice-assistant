# Voice Assistant - Profil-Konfiguration
# Kopiere diese Datei nach config.yaml und trage deine Werte ein.
# config.yaml ist in .gitignore und wird nie eingecheckt (enthält Secrets).
#
# Zwei Modi pro Profil möglich:
#   mode: local      → Mikrofon + Lautsprecher am Pi (ALSA), Wakeword mit openwakeword
#   mode: respeaker  → Mikrofon + LED-Ring + optional Lautsprecher am ReSpeaker-Board
#                      (XVF3800 + XIAO ESP32S3 mit ESPHome-Firmware)
#
# Das alte flache Schema (ohne mode/local_audio/respeaker/leds-Blöcke) wird
# weiterhin akzeptiert und als mode: local interpretiert.

# Optionaler voice-analysis-Container (akustisches Stimmungssignal).
# Leer oder weggelassen = Stimmungsanalyse aus, der Assistent läuft normal.
# Stand bis 2026-07: dieser Wert war eine Konstante im Code — wer von einer
# älteren Fassung aktualisiert und die Analyse weiter nutzen will, muss ihn
# hier eintragen, sonst ist sie stillschweigend aus.
voice_analysis_base: ""

profiles:

  # Voice-Aktuator (optional, standardmäßig AUS).
  # Ohne den Block verhält sich ein Profil exakt wie ohne Aktuator: jeder Satz
  # geht wie gewohnt an den Brain. Erst `enabled: true` PLUS base_url schaltet
  # den schnellen lokalen Schaltpfad ein. Wer keine Hausautomation anbindet,
  # lässt den Block einfach weg. Vertrag der Gegenstelle: ACTUATOR_INTERFACE.md
  #
  #   actuator:
  #     enabled: true
  #     base_url: "http://<hausautomation>:1880/voiceact"   # PFLICHT wenn enabled
  #     llm_url:  "http://localhost:8090/v1/chat/completions"
  #     mqtt_host: ""        # leer = kein MQTT, nur Poll alle refresh_poll_sec
  #     mqtt_port: 1883
  #     refresh_poll_sec: 600
  #     llm_timeout: 5.0
  #     intent_timeout: 1.5
  #
  #     # Der Prompt ist die einzige sprachabhaengige Stelle des Projekts. Der
  #     # Default ist deutsch und nennt Beispiel-Geraete DIESER Installation.
  #     # Wer eine andere Sprache oder andere Geraete hat, ersetzt ihn hier
  #     # komplett — der Code kommt ohne einzige feste Ziel-id aus.
  #     #
  #     # Platzhalter (einfache Textersetzung, KEIN str.format — die
  #     # geschweiften Klammern der JSON-Beispiele bleiben so stehen):
  #     #   {kontrast}      erzeugte Einzelgeraet-gegen-Gruppe-Beispiele
  #     #   {ziel_liste}    die Ziel-Liste aus /capabilities
  #     #   {gruppen_regel} erzeugte Regel fuer Geraete-Mehrzahl ohne Raum
  #     #
  #     # WER DEN PROMPT ERSETZT, MISST NEU:
  #     #   ow-venv/bin/python -m tools.actuator_grammar_test
  #     # Die Testsaetze dort sind ebenfalls deutsch und gehoeren mit uebersetzt.
  #     # Gemessene Erfahrung, sprachunabhaengig: wenige Beispiele schlagen
  #     # viele, und {gruppen_regel} traegt nur HINTER der Ziel-Liste.
  #     system_prompt: |
  #       You are the local switching actuator. Turn the spoken sentence into ONE JSON intent. Output ONLY the JSON.
  #       ... (siehe voice_assistant/config.py, _DEFAULT_ACTUATOR_PROMPT)
  #
  #     # Eine Zeile je Geraetegruppe mit einem Alias "alle <Mehrzahl>".
  #     # Platzhalter: {einzahl_gross} {einzahl} {mehrzahl} {ziel}
  #     gruppen_regel: '{einzahl_gross} WITHOUT ROOM: ...'
  #
  #     # Satzschablonen fuer die erzeugten Kontrast-Beispiele, je Aktion.
  #     beispiel_saetze:
  #       ein: "Turn on {}"
  #       aus: "Turn off {}"
  #     # Ziel-Typen, die der Beispielblock im Prompt schon vorfuehrt — der
  #     # erzeugte Kontrast-Block laesst sie dann aus.
  #     beispiel_typen: ["rollo"]

  # ---------------------------------------------------------------------
  # Beispiel "local" - Mikrofon/Lautsprecher direkt am Pi
  # ---------------------------------------------------------------------
  clawdpi:
    mode: local

    local_audio:
      device_index: 1                             # ALSA-Mic-Index (arecord -l)
      playback_device: "plughw:CARD=ZM350,DEV=0"  # ALSA-Ausgabe (aplay -l)
      rate_in: 48000                              # wird intern auf 16kHz resampelt
      resample: true

    leds:
      wled:
        enabled: true
        host: "wled.local"                        # WLED-Controller Hostname/IP
      respeaker_ring:
        enabled: false                            # im local-Modus irrelevant

    # Speaches GPU-Container (OpenAI-kompatibler STT/TTS-Server)
    speaches_base: "http://<speaches-host>:8000"
    speaches_stt_model: "guillaumekln/faster-whisper-medium"
    speaches_tts_model: "speaches-ai/piper-de_DE-thorsten-medium"
    speaches_tts_voice: "de_DE-thorsten-medium"

    openclaw_token: "DEIN_TOKEN_HIER"
    openclaw_session: "agent:main:telegram:group:DEINE_CHAT_ID"

    telegram_bot_token: "DEIN_BOT_TOKEN_HIER"
    telegram_chat_id: "-DEINE_CHAT_ID"

    tts_prefix: ""

    # VAD-Empfindlichkeit — alle Felder optional, Defaults sind für ruhige Umgebungen.
    # In lauten Umgebungen (Fablab, Werkstatt) anpassen:
    #   1. Hintergrund-RMS messen (test_wakeword.py oder aus voice_assistant-Logs)
    #   2. vad_voice_rms_min knapp über dem Hintergrund-RMS setzen
    #   3. silence_seconds verkürzen damit Aufnahme schneller endet
    # vad_aggressiveness: 3         # 0–3, Default 3 (aggressivste Geräuschunterdrückung)
    # vad_voice_rms_min: 0          # 0 = deaktiviert; Fablab-Empfehlung: ~900
    # silence_seconds: 2.0          # Stille bis Aufnahme-Ende (ZEITBASIERT, gilt auf
    #                               #   allen Profilen gleich). Höher = geduldiger bei
    #                               #   Denkpausen, aber träger. Fablab/laut: ~1.0
    # silence_chunks_limit: 0       # Legacy-Override in Chunks; > 0 schlägt silence_seconds.
    #                               #   Nur falls explizit chunk-genau nötig. 0 = aus.
    #
    # Kommando-Modus: greift NUR, wenn der Nutzer durchgesprochen hat, ohne das
    # "Ja?" abzuwarten (Ein-Satz). Das sind fast immer kurze Schaltbefehle für
    # den Aktuator — da zählt Tempo, Denkpausen kommen nicht vor. Wer das "Ja?"
    # abwartet, bekommt weiter silence_seconds / 30 s.
    # command_silence_seconds: 1.0  # Stille bis Aufnahme-Ende im Kommando-Modus
    # command_max_seconds: 8.0      # harter Deckel im Kommando-Modus

    # Locale — all fields optional, defaults shown here (German)
    # locale:
    #   wakeword_ack: "Ja?"
    #   confirmation_prefix: "Ich habe verstanden: "
    #   no_reply_fallback: "Entschuldigung, ich konnte keine Antwort erhalten."
    #   openclaw_voice_instruction: >
    #     [VOICE: Call all necessary tools first, then reply in max 2-3 spoken
    #     sentences. No markdown, no lists, no abbreviations.
    #     Never invent anything — either call a tool or say what you don't know.]
    #   thinking_phrases:
    #     - "Einen Moment bitte."
    #     - "Ich schaue kurz nach."
    #     - "Ich bin noch dabei."
    #     - "Fast fertig."
    #     - "Noch einen Augenblick."

    # Wakewords — optional. Fehlt der Block komplett: ein Eintrag 'hey_jarvis'
    # mit den Profil-Defaults oben (Rückwärtskompatibilität). Mehrere Einträge
    # erlauben parallel aktive Wakewords, die je auf eine eigene OpenClaw-
    # Session routen (x-openclaw-session-key) — Details: Wakeword_Studio_Spec.md.
    # wakewords:
    #   - bundle: gaston                        # models/wakewords/gaston/
    #     session: "agent:main:telegram:group:DEINE_CHAT_ID"
    #     ack: "Ja?"                            # optional, Default: locale.wakeword_ack
    #     tts_voice: "de_DE-thorsten-medium"     # optional, Default: speaches_tts_voice
    #     threshold: 0.6                        # optional, Default: manifest.yaml oder 0.65
    #     min_hits: 2                           # optional, Streak-Länge bis Trigger
    #     min_peak: 0.7                         # optional, Peak-Bedingung im Streak
    #     min_peak_short: 0.9                   # optional, strengerer Peak für Streaks < 3 Frames
    #   - bundle: hey_jarvis                    # eingebautes openwakeword-Modell
    #     session: "agent:zweiter:telegram:group:ANDERE_CHAT_ID"

  # ---------------------------------------------------------------------
  # Beispiel "respeaker" - Mic + LED-Ring + Speaker am ReSpeaker
  # ---------------------------------------------------------------------
  openclaw:
    mode: respeaker

    respeaker:
      host: "respeaker.local"                     # ESPHome-Gerät im WLAN
      port: 6053
      encryption_key: ""                          # Native-API-Key falls gesetzt
      use_speaker: true                           # TTS über ReSpeaker-Speaker
                                                  # (false → Fallback auf local_audio.playback_device)

    local_audio:
      # wird nur gebraucht, wenn use_speaker=false (Fallback)
      playback_device: "plughw:CARD=P710e,DEV=0"

    leds:
      wled:
        enabled: true
        host: "wled.local"                        # WLED kann parallel aktiv sein
      respeaker_ring:
        enabled: true                             # LED-Ring am ReSpeaker nutzen

    speaches_base: "http://<speaches-host>:8000"
    speaches_stt_model: "xkeyC/whisper-large-v3-turbo-gguf"
    speaches_tts_model: "speaches-ai/piper-de_DE-thorsten_emotional-medium"
    speaches_tts_voice: "de_DE-thorsten_emotional-medium"

    openclaw_token: "DEIN_TOKEN_HIER"
    openclaw_session: "agent:main:telegram:group:DEINE_CHAT_ID"

    telegram_bot_token: "DEIN_BOT_TOKEN_HIER"
    telegram_chat_id: "-DEINE_CHAT_ID"

    tts_prefix: "hm "

    # locale: (see clawdpi profile above for available fields and defaults)

# Hostname-Zuordnung: Welcher Hostname-Substring → welches Profil
hostname_map:
  clawdpi: clawdpi
  openclaw: openclaw
