# ESPHome-Firmware für ReSpeaker XVF3800 + XIAO ESP32-S3
# Wird vom OpenClaw Voice Assistant über ESPHome Native API (Port 6053) gesteuert.
# Kein Home Assistant erforderlich — Python-Client nutzt aioesphomeapi direkt.
#
# Flashen:
#   cd ~/openclaw_voice_assist
#   esphome-venv/bin/esphome run esphome/respeaker.yaml --device /dev/ttyACM0
#   OTA: esphome-venv/bin/esphome run esphome/respeaker.yaml --device respeaker-openclaw.local
#
# Wakeword läuft auf dem Pi (openwakeword "hey jarvis").
# Der ESP streamt Audio kontinuierlich via voice_assistant + button trigger.

substitutions:
  device_name: respeaker-openclaw
  friendly_name: "ReSpeaker OpenClaw"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  on_boot:
    - priority: -100
      then:
        - script.execute: animation_loop
        - delay: 10s
        - script.execute: xvf_params_lesen

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 10min
  on_connect:
    - lambda: id(boot_step) = 3;  # WiFi verbunden — erste 3 LEDs an
    - script.execute: animation_loop
  on_disconnect:
    - lambda: |-
        id(va_phase) = 0;
        id(boot_step) = 0;
    - script.execute: animation_loop

logger:
  level: INFO
  logs:
    i2s_audio: WARN
    respeaker_xvf3800: INFO
    voice_assistant: INFO

http_request:
  timeout: 10s

# ESPHome Native API — darüber spricht der Python-Client (aioesphomeapi, Port 6053)
api:
  # encryption:
  #   key: !secret api_encryption_key
  on_client_disconnected:
    - lambda: |-
        id(va_phase) = 0;
        id(boot_step) = 3;  // WiFi läuft noch, Pi-Script nicht
    - script.execute: animation_loop

ota:
  - platform: esphome
    password: !secret ota_password

i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    scan: true
    frequency: 100kHz

# I2S-Audio — LRCLK/BCLK werden vom XVF3800 als Master getrieben
i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  - platform: i2s_audio
    id: i2s_out_speaker
    dac_type: external
    i2s_dout_pin: GPIO44
    i2s_audio_id: i2s_output
    i2s_mode: secondary
    channel: stereo
    bits_per_sample: 32bit
    sample_rate: 48000
    timeout: never

media_player:
  - platform: speaker
    id: respeaker_player
    name: "ReSpeaker Player"
    announcement_pipeline:
      speaker: i2s_out_speaker
      format: WAV

audio_dac:
  - platform: aic3104
    id: aic3104_dac
    i2c_id: internal_i2c

# Feste Commits statt Branches: mit "ref: main" + "refresh: 0s" zog jeder
# Build den neuesten Stand. Am 2026-10-02 verlangte der ESPHome 2026.9, der
# Flash-venv hatte 2026.4 — und der Fork-Stand des laufenden Aprilbuilds war
# online nicht mehr vorhanden (Branch neu aufgesetzt). Ein Update ist jetzt
# eine bewusste Aenderung dieser zwei Zeilen, zusammen mit esphome im
# esphome-venv und min_version.
#   i2s_audio-Fork: nimmt jeden dritten 48-kHz-Frame -> 16 kHz (seit Januar
#   unveraendert, auch im Aprilbuild); der Original-Treiber geht mit dem
#   Board nicht.
external_components:
  - source:
      type: git
      url: https://github.com/formatBCE/esphome
      ref: 9f8c1d07dec4dd81d4b19d53621a63ede85391f1   # respeaker_microphone, 2026-09-26
    components:
      - i2s_audio
    refresh: never
  - source:
      type: git
      url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
      ref: 8115b7b3ce73da5c22d0edf83ac5ae3430dba940   # main, 2026-09-29, fuer ESPHome 2026.9.0
    components:
      - respeaker_xvf3800
      - aic3104
    refresh: never

# XVF3800-DSP über I2C
respeaker_xvf3800:
  id: respeaker
  address: 0x2C
  mute_switch:
    id: mic_mute_switch
    name: "Microphone Mute"
    update_interval: 1s
  dfu_version:
    name: "DSP Firmware Version"
    update_interval: 120s
  led_beam_sensor:
    name: "Voice Direction"
    id: beam_direction
    internal: false
    on_value:
      - lambda: |-
          // XVF3800 liefert direkt LED-Index 0–11 (nicht Grad)
          // +6 = 180° Korrektur (Gerät mit LEDs oben montiert)
          id(beam_led_pos) = ((int)(x + 0.5f) + 6) % 12;
  firmware:
    url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration/raw/refs/heads/main/application_xvf3800_inthost-lr48-sqr-i2c-v1.0.7-release.bin
    version: "1.0.7"
    md5: 043a848f544ff2c7265ac19685daf5de

# Button damit der Pi eine Hör-Session starten kann (kein micro_wakeword mehr —
# Wakeword läuft als openwakeword auf dem Pi gegen den Audio-Stream).
button:
  - platform: template
    name: "Start Listening"
    id: start_listening_btn
    on_press:
      - voice_assistant.start:
  # Nur LESEN: die Signalverarbeitung des XVF3800 ins Log (Tag xvf_params).
  - platform: template
    name: "XVF-Parameter lesen"
    id: xvf_params_btn
    entity_category: diagnostic
    on_press:
      - script.execute: xvf_params_lesen

select:
  # Was der XVF3800 auf den LINKEN Ausgang legt = was als zweiter Kanal
  # (data2) beim Assistenz-Rechner ankommt. Geschrieben wird
  # AUDIO_MGR_OP_L (resid 35, cmd 15, <category>, <source>), IDs aus Seeeds
  # xvf_host.py. Nicht dauerhaft: nach jedem Neustart wieder Werkszustand
  # (restore_value: false), damit kein Mitschnitt-Modus haengen bleibt.
  # Kategorien laut XMOS-Tuning-Doku: 8 = ASR-/Auto-Strahl (Werk, (8,0)),
  # 5 = Referenz nach Gain (das, was der ESP an den Lautsprecher gibt),
  # 1 = Rohmikrofon.
  - platform: template
    name: "XVF-Ausgang links"
    id: xvf_op_l
    entity_category: config
    optimistic: true
    restore_value: false
    options:
      - "ASR-Strahl (8,0)"
      - "Wiedergabe-Referenz (5,0)"
      - "Rohmikrofon 0 (1,0)"
    initial_option: "ASR-Strahl (8,0)"
    on_value:
      - lambda: |-
          static const uint8_t wahl[][2] = {{8, 0}, {5, 0}, {1, 0}};
          if (i >= sizeof(wahl) / sizeof(wahl[0])) return;
          // {resid, cmd, Anzahl Bytes, Werte} wie xmos_write_bytes() der Integration
          uint8_t payload[5] = {35, 15, 2, wahl[i][0], wahl[i][1]};
          if (id(respeaker).write(payload, sizeof(payload)) != i2c::ERROR_OK) {
            ESP_LOGW("xvf_op", "AUDIO_MGR_OP_L setzen fehlgeschlagen");
          } else {
            ESP_LOGI("xvf_op", "AUDIO_MGR_OP_L = %u, %u", wahl[i][0], wahl[i][1]);
          }

number:
  # Hauptzustand — Pi schickt Phase 0–11, ESP spielt passende Animation
  - platform: template
    name: "LED Phase"
    id: led_phase_input
    min_value: 0
    max_value: 12
    step: 1
    optimistic: true
    on_value:
      - lambda: |-
          id(va_phase) = (int)x;
          id(dot_pos) = 0;
          id(tick_count) = 0;
      - script.execute: animation_loop

  # Boot-Fortschritt — Pi setzt 0/3/6/9/12 je abgeschlossenem Init-Schritt
  # 0=Start, 3=WiFi, 6=API-Connect, 9=Speaches, 12=Wakeword-Modell geladen
  - platform: template
    name: "Boot Step"
    id: boot_step_input
    min_value: 0
    max_value: 12
    step: 1
    optimistic: true
    on_value:
      - lambda: id(boot_step) = (int)x;

# voice_assistant — Pi steuert alle LED-Phasen, keine internen Handler
voice_assistant:
  id: va
  # Zwei Kanaele (ESPHome 2026.5, #16265): der erste kommt beim
  # Assistenz-Rechner als data, der zweite als data2 in handle_audio an.
  # Kanal 1 (rechts) = XVF-Ausgang R, Werkseinstellung (7,3): AEC-Residual
  # von Mikrofon 3 — EIN Mikrofon, ohne Beam/Rauschunterdrueckung/AGC. Darauf
  # laufen seit April Wakeword UND STT. formatBCE nimmt fuer die STT Kanal 0.
  # Kanal 0 (links) = XVF-Ausgang L, umschaltbar per "XVF-Ausgang links":
  # ASR-Strahl (Werk), Wiedergabe-Referenz oder Rohmikrofon. Erster Zweck:
  # die eigene Wiedergabe mitschneiden (Verstuemmelung im Fablab-Test
  # 2026-10-02); zweiter: Kanal 0 gegen Kanal 1 fuer die STT messen.
  microphone:
    - microphone: i2s_mics
      channels: 1
    - microphone: i2s_mics
      channels: 0
  media_player: respeaker_player
  noise_suppression_level: 1
  auto_gain: 31dBFS
  volume_multiplier: 4.0

# --- LED-Steuerung ---
globals:
  - id: va_phase
    type: int
    restore_value: no
    initial_value: '0'
  - id: boot_step
    type: int
    restore_value: no
    initial_value: '0'
  - id: dot_pos
    type: int
    restore_value: no
    initial_value: '0'
  - id: tick_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: beam_led_pos
    type: int
    restore_value: no
    initial_value: '0'

script:
  # Ist-Werte der XVF3800-Signalverarbeitung, nur lesend. Anlass (2026-10-02):
  # die Aufnahmen wirkten leise, und digitale Verstaerkung auf dem Pi brachte
  # nachweislich nichts (WAKEWORD_PROCESS.md). Der Pegel kommt aus der AGC des
  # XVF3800 selbst; was dort eingestellt ist, hat bisher niemand gelesen — die
  # Doku nennt je Fassung andere Defaults (PP_AGCMAXGAIN 31,6 bzw. 125).
  # Die voice_assistant-Werte auto_gain/volume_multiplier weiter unten wirken
  # hier NICHT: sie gehen als audio_settings an den Server, und der Pi
  # ignoriert sie.
  # IDs (resid, cmd) aus Seeeds python_control/xvf_host.py
  # (github.com/respeaker/reSpeaker_XVF3800_USB_4MIC_ARRAY); Protokoll wie
  # read_led_beam_direction() der Integration: {resid, cmd|0x80, n+1} senden,
  # Statusbyte + n Bytes lesen. Nur Status 0 (CTRL_DONE) ist gueltig; CTRL_WAIT
  # und 0x40 (RETRY) sind laut Integration normal -> bis zu 10x wiederholen.
  - id: xvf_params_lesen
    mode: single
    then:
      - lambda: |-
          struct P { const char *name; uint8_t resid, cmd, anzahl; char typ; };
          // typ: f = float, i = int32, u = uint8 (je anzahl Werte)
          static const P params[] = {
            {"AUDIO_MGR_MIC_GAIN",  35,  0, 1, 'f'},
            {"AUDIO_MGR_REF_GAIN",  35,  1, 1, 'f'},
            {"AUDIO_MGR_OP_L",      35, 15, 2, 'u'},
            {"AUDIO_MGR_OP_R",      35, 19, 2, 'u'},
            {"AUDIO_MGR_OP_UPSAMPLE", 35, 14, 2, 'u'},
            {"AUDIO_MGR_SYS_DELAY", 35, 26, 1, 'i'},
            {"AEC_FIXEDBEAMSONOFF", 33, 37, 1, 'i'},
            {"PP_AGCONOFF",         17, 10, 1, 'i'},
            {"PP_AGCMAXGAIN",       17, 11, 1, 'f'},
            {"PP_AGCDESIREDLEVEL",  17, 12, 1, 'f'},
            {"PP_AGCGAIN",          17, 13, 1, 'f'},
            {"PP_AGCTIME",          17, 14, 1, 'f'},
            {"PP_AGCFASTTIME",      17, 15, 1, 'f'},
            {"PP_MIN_NS",           17, 21, 1, 'f'},
            {"PP_MIN_NN",           17, 22, 1, 'f'},
          };
          for (const auto &p : params) {
            const uint8_t breite = (p.typ == 'u') ? 1 : 4;
            const uint8_t n = p.anzahl * breite;
            uint8_t req[3] = {p.resid, (uint8_t) (p.cmd | 0x80), (uint8_t) (n + 1)};
            uint8_t resp[9] = {0};
            bool ok = false;
            for (int versuch = 0; versuch < 10 && !ok; versuch++) {
              if (id(respeaker).write_read(req, 3, resp, n + 1) != i2c::ERROR_OK) {
                ESP_LOGW("xvf_params", "%s: I2C-Fehler", p.name);
                break;
              }
              ok = resp[0] == 0;
              if (!ok) delay(10);
            }
            if (!ok) {
              ESP_LOGW("xvf_params", "%s: Status %u", p.name, resp[0]);
              continue;
            }
            if (p.typ == 'f') {
              float v; memcpy(&v, &resp[1], 4);
              ESP_LOGI("xvf_params", "%s = %g", p.name, v);
            } else if (p.typ == 'i') {
              int32_t v; memcpy(&v, &resp[1], 4);
              ESP_LOGI("xvf_params", "%s = %d", p.name, (int) v);
            } else {
              ESP_LOGI("xvf_params", "%s = %u, %u", p.name, resp[1], resp[2]);
            }
          }

  # Haupt-Animations-Loop — läuft permanent, wertet va_phase alle 50ms aus
  - id: animation_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: return true;
          then:
            - lambda: |-
                int phase = id(va_phase);
                std::array<uint32_t, 12> c = {};
                uint32_t t_ms = millis();

                if (phase == 0) {
                  // BOOT: boot_step LEDs weiß (0=0 LEDs, 3=WiFi, 6=API, 9=Speaches, 12=Wakeword)
                  int steps = id(boot_step);
                  for (int i = 0; i < steps && i < 12; i++)
                    c[i] = 0x303030;

                } else if (phase == 1) {
                  // IDLE: alle LEDs sehr gedimmt blau, Beam-LED etwas heller
                  int pos = id(beam_led_pos);
                  for (auto& x : c) x = 0x000040;  // Basis: sehr gedimmt
                  c[pos] = 0x000060;                // Beam-Richtung: leicht heller

                } else if (phase == 2) {
                  // WAKEWORD: alle 12 LEDs hell rot
                  for (auto& x : c) x = 0x7F0000;

                } else if (phase == 3) {
                  // RECORDING: rote Basis + Beam-Direction-Highlight
                  for (auto& x : c) x = 0x280000;
                  int b = id(beam_led_pos);
                  c[b] = 0xFF0000;
                  c[(b + 1) % 12] = 0x600000;
                  c[(b + 11) % 12] = 0x600000;

                } else if (phase >= 4 && phase <= 6) {
                  // STT(4)/CONFIRMATION(5)/OPENCLAW_WAIT(6): rotierender Punkt
                  // Geschwindigkeit: 4=150ms/Schritt, 5=100ms, 6=50ms
                  id(tick_count)++;
                  int tc = id(tick_count);
                  bool advance = (phase == 4) ? (tc % 3 == 0)
                               : (phase == 5) ? (tc % 2 == 0)
                               : true;
                  if (advance) id(dot_pos) = (id(dot_pos) + 1) % 12;
                  int pos = id(dot_pos);
                  uint32_t bright = (phase == 6) ? 0x800080 : 0x0000FF;  // 6=rot-lila
                  uint32_t dim    = (phase == 6) ? 0x200020 : 0x000040;
                  c[pos] = bright;
                  c[(pos + 1) % 12] = dim;
                  c[(pos + 11) % 12] = dim;

                } else if (phase == 7) {
                  // ANSWER_GLOW: alle LEDs grün, statisch
                  for (auto& x : c) x = 0x007F00;

                } else if (phase == 8) {
                  // AUDIO_OUT: alle LEDs grün, pulsierend (~1.2s)
                  float t = (t_ms % 1200) / 1200.0f;
                  uint8_t g = (uint8_t)((0.35f + 0.65f * (0.5f + 0.5f * sinf(t * 6.283f))) * 0x7F);
                  for (auto& x : c) x = ((uint32_t)g << 8);

                } else if (phase == 9) {
                  // END: alle aus (Pi wechselt nach Pause auf Phase 1)

                } else if (phase == 10) {
                  // ERROR: 6 LEDs (halber Ring), rot, statisch
                  for (int i = 0; i < 6; i++) c[i] = 0x3F0000;

                } else if (phase == 11) {
                  // FOLLOWUP: warm-gelb, sanft pulsierend (~2.5s) — für Rückfrage
                  float t = (t_ms % 2500) / 2500.0f;
                  float br = 0.25f + 0.25f * (0.5f + 0.5f * sinf(t * 6.283f));
                  uint8_t r = (uint8_t)(br * 0xFF);
                  uint8_t g = (uint8_t)(br * 0xB0);
                  for (auto& x : c) x = ((uint32_t)r << 16) | ((uint32_t)g << 8);

                } else if (phase == 12) {
                  // NEAR_MISS: Beam-LED orange, Rest sehr dunkel — kurzer Hinweis "fast"
                  int pos = id(beam_led_pos);
                  for (auto& x : c) x = 0x100500;
                  c[pos] = 0xF08000;
                  c[(pos + 1) % 12] = 0x392500;
                  c[(pos + 11) % 12] = 0x392500;
                }

                id(respeaker).set_led_ring(c.data());
            - delay: 50ms
